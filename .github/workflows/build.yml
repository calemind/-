name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: anti-kami-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: anti-kami-app

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antikami-apk
          path: anti-kami-app/app/build/outputs/apk/debug/app-debug.apk
